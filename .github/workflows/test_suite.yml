name: Tencent Cloud Cartography checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: landscape/web/package-lock.json
      - name: Install Python dependencies
        run: uv sync --frozen
      - name: Run Python tests
        run: uv run pytest tests/unit
      - name: Run lint and icon provenance checks
        run: uv run pre-commit run --all-files
      - name: Install web dependencies
        working-directory: landscape/web
        run: npm ci
      - name: Run web tests
        working-directory: landscape/web
        run: npm test -- --run
      - name: Build web application
        working-directory: landscape/web
        run: npm run build
      - name: Audit production dependencies
        working-directory: landscape/web
        run: npm audit --audit-level=high

  neo4j-integration:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/integration-only-password
          NEO4J_server_memory_heap_initial__size: 256m
          NEO4J_server_memory_heap_max__size: 512m
          NEO4J_server_memory_pagecache_size: 256m
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p integration-only-password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - name: Verify actual Neo4j transactions, isolation and viewer reads
        env:
          TEST_TENCENT_NEO4J_URI: bolt://127.0.0.1:7687
          TEST_TENCENT_NEO4J_USER: neo4j
          TEST_TENCENT_NEO4J_PASSWORD: integration-only-password
          TEST_TENCENT_NEO4J_DATABASE: neo4j
        run: uv run pytest tests/integration -v
