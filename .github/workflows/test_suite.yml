name: Tencent Cloud Cartography checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: landscape/web/package-lock.json
      - name: Install Python dependencies
        run: uv sync --frozen
      - name: Run Python tests
        run: uv run pytest tests/unit
      - name: Run lint and icon provenance checks
        run: uv run pre-commit run --all-files
      - name: Install web dependencies
        working-directory: landscape/web
        run: npm ci
      - name: Run web tests
        working-directory: landscape/web
        run: npm test -- --run
      - name: Build web application
        working-directory: landscape/web
        run: npm run build
      - name: Audit production dependencies
        working-directory: landscape/web
        run: npm audit --audit-level=high
