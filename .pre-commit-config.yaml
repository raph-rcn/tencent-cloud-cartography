repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: uv run ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format --check
        language: system
        types: [python]
      - id: icon-integrity
        name: Tencent icon integrity
        entry: uv run python scripts/update_tencent_icons.py --check
        language: system
        pass_filenames: false
