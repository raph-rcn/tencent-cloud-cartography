[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tencent-cloud-cartography"
version = "0.2.0"
description = "Local Tencent Cloud inventory, relationships, and editable architecture diagrams."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "cos-python-sdk-v5>=1.9,<2",
    "cryptography>=46,<49",
    "kubernetes>=37,<38",
    "neo4j>=5.26,<7",
    "tencentcloud-sdk-python-intl-en>=3.1.186,<3.2",
]

[project.scripts]
tencent-cloud-cartography = "tencent_cloud_cartography.cli:main"

[project.urls]
Repository = "https://github.com/raph-rcn/tencent-cloud-cartography"

[tool.setuptools.packages.find]
include = ["tencent_cloud_cartography*"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11", "pre-commit>=4"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]

[tool.setuptools.package-data]
tencent_cloud_cartography = ["_web/**/*"]
