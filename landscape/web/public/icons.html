<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tencent Cloud · Official icon library</title>
<style>body{font:15px system-ui;margin:0;background:#f5f8ff;color:#172b4d}header{padding:30px 5vw;background:white;border-bottom:1px solid #dce5f3;position:sticky;top:0;z-index:1}h1{margin:0 0 10px}a{color:#0052d9}input,select{padding:12px;border:1px solid #cad8ec;border-radius:6px;margin:12px 8px 0 0;font:inherit}input{width:min(450px,60vw)}main{padding:30px 5vw;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}.icon{padding:20px;background:white;border:1px solid #dce5f3;border-radius:8px;text-align:center;text-decoration:none;display:flex;align-items:center;flex-direction:column;gap:16px;font-size:13px;min-height:130px}.icon img{width:64px;height:64px;object-fit:contain}#count{color:#52647a}</style>
<header><a href="/">← Architecture diagram</a><h1>Official Tencent Cloud icons</h1><p>896 SVGs · 441 English · 455 Chinese · <a href="https://cloud.tencent.com/act/event/icons" target="_blank" rel="noopener">Tencent source</a> · <a href="/icons/tencent/manifest.json">Provenance & checksums</a></p><input id="search" type="search" placeholder="Search product names"><select id="locale"><option value="">All languages</option><option value="en">English</option><option value="zh">Chinese</option></select><span id="count"></span></header><main id="gallery"></main><script type="module">
const manifest=await (await fetch('/icons/tencent/manifest.json')).json();
const search=document.querySelector('#search'),locale=document.querySelector('#locale'),gallery=document.querySelector('#gallery');
function render(){const entries=manifest.icons.filter(i=>(!locale.value||i.locale===locale.value)&&i.name.toLowerCase().includes(search.value.toLowerCase()));document.querySelector('#count').textContent=entries.length+' icons';gallery.replaceChildren(...entries.map(i=>{const a=document.createElement('a');a.className='icon';a.href='/icons/tencent/'+i.file;a.download=i.file;const img=document.createElement('img');img.src=a.href;img.alt=i.name;img.loading='lazy';const label=document.createElement('span');label.textContent=i.name;a.append(img,label);return a;}));}search.addEventListener('input',render);locale.addEventListener('change',render);render();
</script></html>
